<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KKTR" />
    <meta name="description" content="KKTR Stores — Enterprise Management System" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon + Apple icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- No caching of index.html itself — always fresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>KKTR Stores</title>

    <!-- Inline critical CSS — app shows something immediately even before JS loads -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
             background: #f5f0e8; }
      #root { min-height: 100vh; }

      /* Splash screen shown while JS loads */
      #splash {
        position: fixed; inset: 0;
        background: #1a2e1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s;
      }
      #splash img { width: 100px; height: 100px; border-radius: 16px; margin-bottom: 20px; }
      #splash h1 { color: #F5EDD6; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.05em; }
      #splash p  { color: rgba(245,237,214,0.5); font-size: 0.8rem; margin-top: 6px; }
      #splash .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #F5EDD6; margin-top: 28px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,100% { opacity: 0.2; transform: scale(0.8); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }
    </style>
  </head>
  <body>

    <!-- Splash shown while React boots -->
    <div id="splash">
      <img src="/logo192.png" alt="KKTR" onerror="this.style.display='none'" />
      <h1>KKTR Stores</h1>
      <p>Kete Krachi Timber Recovery</p>
      <div class="dot"></div>
    </div>

    <div id="root"></div>

    <!-- Hide splash once React mounts -->
    <script>
      window.__hideSplash = function() {
        var s = document.getElementById("splash");
        if (s) { s.style.opacity = "0"; setTimeout(function(){ s.remove(); }, 400); }
      };
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(function(reg) {
              console.log("KKTR SW registered:", reg.scope);

              // Listen for SW messages (e.g. SYNC_NOW from background sync)
              navigator.serviceWorker.addEventListener("message", function(e) {
                if (e.data && e.data.type === "SYNC_NOW") {
                  // Trigger offline queue sync in app
                  window.dispatchEvent(new Event("online"));
                }
              });
            })
            .catch(function(err) {
              console.log("SW registration failed:", err);
            });
        });
      }
    </script>

  </body>
</html>
